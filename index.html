<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Juego Multijugador con Chat</title>
  <style>
    body {
      background: #000;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    #container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-top: 20px;
    }
    canvas {
      background: #111;
      border: 1px solid white;
    }
    #chat {
      margin-left: 20px;
      width: 250px;
      height: 500px;
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      background: #222;
      color: white;
      padding: 5px;
      overflow-y: auto;
      border: 1px solid white;
      font-size: 14px;
    }
    #input {
      display: flex;
      margin-top: 5px;
    }
    #msgInput {
      flex: 1;
      padding: 5px;
      font-size: 14px;
    }
    button {
      padding: 5px 10px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="game" width="500" height="500"></canvas>
    <div id="chat">
      <div id="messages"></div>
      <div id="input">
        <input type="text" id="msgInput" placeholder="Mensaje..." />
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const socket = new WebSocket("ws://localhost:3000");

    let id = null;
    let players = {};

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let pid in players) {
        const p = players[pid];
        ctx.fillStyle = pid === id ? "red" : "green";
        ctx.fillRect(p.x, p.y, 30, 30);
        ctx.fillStyle = "white";
        ctx.font = "12px sans-serif";
        ctx.fillText("Jugador " + pid, p.x, p.y - 5);
      }
    }

    document.addEventListener("keydown", (e) => {
      if (!id) return;
      const player = players[id];
      if (!player) return;

      if (e.key === "ArrowUp") player.y -= 5;
      if (e.key === "ArrowDown") player.y += 5;
      if (e.key === "ArrowLeft") player.x -= 5;
      if (e.key === "ArrowRight") player.x += 5;

      socket.send(
        JSON.stringify({ type: "move", x: player.x, y: player.y })
      );
      draw();
    });

    socket.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "init") {
        id = msg.id;
        players = msg.players;
      }

      if (msg.type === "update") {
        if (!players[msg.id]) players[msg.id] = {};
        players[msg.id].x = msg.x;
        players[msg.id].y = msg.y;
      }

      if (msg.type === "remove") {
        delete players[msg.id];
      }

      if (msg.type === "chat") {
        const messages = document.getElementById("messages");
        const el = document.createElement("div");
        el.textContent = `Jugador ${msg.id}: ${msg.message}`;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
      }

      draw();
    };

    function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (text !== "") {
        socket.send(JSON.stringify({ type: "chat", message: text }));
        input.value = "";
      }
    }
  </script>
</body>
</html>
