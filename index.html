<!DOCTYPE html>
<html>
<head>
  <title>Juego WebSocket</title>
  <style>
    canvas { background: #111; display: block; margin: auto; border: 1px solid white; }
  </style>
</head>
<body>
<canvas id="game" width="500" height="500"></canvas>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const socket = new WebSocket("ws://localhost:3000");
  let id = null;
  let players = {};

  socket.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'init') {
      id = msg.id;
      players = msg.players;
    }

    if (msg.type === 'update') {
      if (!players[msg.id]) players[msg.id] = {};
      players[msg.id].x = msg.x;
      players[msg.id].y = msg.y;
    }

    if (msg.type === 'remove') {
      delete players[msg.id];
    }

    draw();
  };

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const [pid, p] of Object.entries(players)) {
      ctx.fillStyle = p.color || "white";
      ctx.fillRect(p.x, p.y, 30, 30);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (!players[id]) return;
    const p = players[id];
    switch (e.key) {
      case 'ArrowUp': p.y -= 5; break;
      case 'ArrowDown': p.y += 5; break;
      case 'ArrowLeft': p.x -= 5; break;
      case 'ArrowRight': p.x += 5; break;
    }
    socket.send(JSON.stringify({ type: 'move', x: p.x, y: p.y }));
    draw();
  });
</script>
</body>
</html>
